<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link rel="stylesheet" href="./dom7.css">
</head>
<body>
    


<h1>Registration Form</h1>
<form id="studentform">
    <label for="">Name:</label>
    <input type="text" placeholder="Enter Your Name..." id="name"><br><br>
    <label for="">Age:</label>
    <input type="number" id="age"><br><br>
    <label for="">Email:</label>
    <input type="email" id="email"><br><br>
    <label for="">Phone:</label>
    <input type="number" id="phone"><br><br>
    <label for="">Address:</label>
    <textarea name="" id="address">Type your address</textarea><br><br>
    <label for="">Gender:</label>
    <input type="radio" name="gender" value="female">
    <label for="">Female</label>
    <input type="radio" name="gender" value="male">
    <label for="">Male</label><br><br>
    <label for="">Qualification:</label>
    <select id="qualification">
        <option value=""hidden>choose your qualification</option>
        <option value="sslc">SSLC</option>
        <option value="hsc">HSC</option>
        <option value="diploma">Diploma</option>
        <option value="bachelor">Bachelor</option>
        <option value="master">Master</option>
    </select><br><br>
    <label for="">Blood Group:</label>
    <select name="" id="blood">
         <option value=""hidden>choose your Blood group</option>
        <option value="a-ve">a-ve</option>
        <option value="o+ve">o+ve</option>
         <option value="o-ve">o-ve</option>
          <option value="b+ve">b+ve</option>
           <option value="b-ve">b-ve</option>
            <option value="ab+ve">ab+ve</option>
    </select><br><br>
    
    <label for="">Date Of Birth:</label>
    <input type="date" id="dob"><br><br>
    <label for="">Profile:</label>
    <input type="file" name="" id="profile"><br><br>
    <label for="">I accept Terms and Condition:</label>
    <input type="checkbox" name="" id="terms"><br><br>
    <label for="">Usename:</label>
    <input type="text" id="username"><br><br>
    <label for="">Password:</label>
    <input type="text" id="password"><br><br>
    <button>Submit</button>
</form>


<script>
   
   document.getElementById("studentform").onsubmit=(e)=>{
    e.preventDefault();
    validate();
   

   }
    function validate(){
        
        let name = document.getElementById("name").value.trim();
        let age = document.getElementById("age").value;
        let email = document.getElementById("email").value.trim();
        let phone = document.getElementById("phone").value.trim();
        let address = document.getElementById("address").value .trim();
        let Gender = document.querySelector("input[name='gender']:checked");
        let qualification = document.getElementById("qualification").value;
        let blood = document.getElementById("blood").value;
        let dob = document.getElementById("dob").value;
        let profile= document.getElementById("profile");
        let username = document.getElementById("username").value.trim();
        let password = document.getElementById("password").value;
        let terms = document.getElementById("terms").checked;
    
        //name
        if(name===""){
            alert("please enter your name");
            return;
        }
        let namePattern = /^[A-Za-z ]+$/;
        if(!namePattern.test(name)){
            alert("Name should contain only alphabets and spaces");
            return;
        }

        //age
        if(age===""){
            alert("please enter your age");
            return;
        }
        if(age<1||age>100){
        alert("age must be between 1 and 100");
        return;
        }

        //email
        if(email===""){
            alert("please enter your email");
            return;
        }
        let emailPattern = /^[a-zA-Z0-9_.]+@gmail\.com$/;
        if(!emailPattern.test(email)){
            alert("please enter your valid email");
            return;
        }

        //phone
         if(phone===""){
            alert("please enter your phone Number");
            return;
         }
        let phonePattern = /^[0-9+/-]{10,15}$/;
        if(!phonePattern.test(phone)){
            alert("phone must be contain 10-15 character");
            return;
        }

        //address
        if(address==""){
            alert("please enter your address");
            return;
        }
        //gender
        if(Gender===null){
            alert("please enter your gender");
            return;
        }
        //qualification
        if(qualification===""){
            alert("please enter your qualification");
            return;
        }
        //blood
        if(blood===""){
            alert("please enter your blood group");
            return;
        }
        //dob
        if(dob===""){
            alert("please enter your Date of birth");
            return;
        }
        let today = new Date();
        let selectedDate = new Date(dob);
        if(selectedDate>=today){
            alert("DOB must be less current date ");
            return;
        }
        //profile
        if(profile.files.length===0){
            alert("please upload your profile photo");
            return;
        }

        //username
        if(username===""){
            alert("please enter your username");
            return;
        }
        let usernamePattern = /^[A-Za-z0-9_.]+$/;
        if(!usernamePattern.test(username)){
            alert("username contain alphabets, numbers,_,-,.");
            return;
        }

        //password
        if(password===""){
            alert("please enter your password");
            return;
        }
        let passwordPattern = /^[a-zA-Z0-9!@#$%^&*()]+$/;
        if(!passwordPattern.test(password)){
            alert("password must be contain small and capital letter,number and special characters");
            return;
        }
        
let value = password.value;

let small = /[a-z]/.test(value);
let capital = /[A-Z]/.test(value);
let number = /[0-9]/.test(value);
let special = /[!@#$%^&*]/.test(value);

if (small && !capital && !number && !special) {
    console.log("Weak");
}
else if (small && capital && !number && !special) {
    console.log("Normal");
}
else if (small && capital && number && !special) {
    console.log("Good");
}
else if (small && capital && number && special) {
    console.log("Strong");
}
        //term
         if(!terms){
            alert("accept terms and conditions");
            return;
        }
        //success
        alert("Registration Successfully");
        return;
    }


</script>

</body>
</html>
